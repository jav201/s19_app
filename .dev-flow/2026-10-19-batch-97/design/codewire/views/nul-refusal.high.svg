<text x="40" y="476" fill="#b91c1c">H-N1 · dict_to_flow ──▶ _resolve_manifest_entry.raw_entry</text>
<text x="40" y="490" fill="#b91c1c">what: for every unsafe read ref the shipped loaders give the code of the shared guard, MANIFEST-PATH-ESCAPE. LLR-146.14 asks FLOW-UNSAFE-REF (flow) and CHAIN-SET-UNSAFE-REF (set) for a NUL in the same fields</text>
<text x="40" y="504" fill="#b91c1c">decision: changes I-6: state the placement and the code for each field family, or amend LLR-146.14 to MANIFEST-PATH-ESCAPE for read refs (the TC-B94-31 rule)</text>
<rect x="30" y="532" width="1620" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="548" fill="#b91c1c">H-N2 · dict_to_flow</text>
<text x="40" y="562" fill="#b91c1c">what: an unsafe `output_name` has its own shipped code, FLOW-UNSAFE-OUTPUT-NAME. LLR-146.14 asks FLOW-UNSAFE-REF for a NUL in that field</text>
<text x="40" y="576" fill="#b91c1c">decision: same decision as H-N1 (one row in I-6)</text>
<rect x="30" y="604" width="1620" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="620" fill="#b91c1c">H-N3 · _parse_external_step_entry</text>
<text x="40" y="634" fill="#b91c1c">what: I-6 names `load_flow_json`, `load_chain_set` and `_resolve_manifest_entry`. The field checks live in four other functions. For `log_ref` and `output_path` today a NUL is accepted, not raised</text>
<text x="40" y="648" fill="#b91c1c">decision: no new D. I-6 lists the real owner functions. The NC of LLR-146.14 names the acceptance arms</text>
