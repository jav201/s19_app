<rect x="30" y="394" width="1604.6" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="410" fill="#b91c1c">H-W1 · lane_layout</text>
<text x="40" y="424" fill="#b91c1c">what: D21 freezes `&lt;screen&gt;_layout(width) -&gt; NamedTuple`. But the §3 formulas need more inputs. They need the card count (`lane_layout(viewport_w, n)` in §3), the inspector width and the table width</text>
<text x="40" y="438" fill="#b91c1c">decision: changes D21. Fix the input list of each layout function (this graph proposes one). The inputs are measured content widths, not the terminal width</text>
<rect x="30" y="466" width="1604.6" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="482" fill="#b91c1c">H-W2 · [Data: PatchEditorPanel layout] ──▶ PatchEditorPanel._render_before_after_card</text>
<text x="40" y="496" fill="#b91c1c">what: D21 says `_apply_layout` &quot;sets widths only&quot;. The strip byte count, the clipped card text, the Fields name and the full-name line are painted text whose content depends on the width. No step repaints them on resize</text>
<text x="40" y="510" fill="#b91c1c">decision: changes D21: `_apply_layout` also re-renders each width-dependent painted widget, or each such widget reads the layout at paint time and `_apply_layout` asks for that paint</text>
<rect x="30" y="538" width="1604.6" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="554" fill="#b91c1c">H-W3 · BeforeAfterCard.show_entry</text>
<text x="40" y="568" fill="#b91c1c">what: D5 derives `max_bytes` from the inspector width, but `show_entry` takes no `max_bytes`. Only the pure composer does</text>
<text x="40" y="582" fill="#b91c1c">decision: none. List it in the Inc-4 scope</text>
