<text x="40" y="358" fill="#b91c1c">H-C1 · resolve_chip_target.target ──▶ open_folder_in_file_manager.path</text>
<text x="40" y="372" fill="#b91c1c">what: without a project the `checks` chip resolves to `.s19tool/workarea/patches` (recorded, TC-703), but LLR-148.10 labels it `📂 Open checks/`</text>
<text x="40" y="386" fill="#b91c1c">decision: changes I-1 (label rule): derive the label from the resolved target name, or keep the family label and amend HLR-148 / LLR-148.10</text>
<rect x="30" y="414" width="2578.4" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="430" fill="#b91c1c">H-C2 · OpenFolderChip._open_target ──▶ create_chip_home</text>
<text x="40" y="444" fill="#b91c1c">what: the press path calls `create_chip_home` for every missing target. Nothing reads `_CREATABLE_FAMILIES`</text>
<text x="40" y="458" fill="#b91c1c">decision: changes I-1: the `when:` of this edge must be in the code (read `_CREATABLE_FAMILIES` in the press path or in `create_chip_home`)</text>
<rect x="30" y="486" width="2578.4" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="502" fill="#b91c1c">H-C3 · OpenFolderChip._open_target ──▶ is_openable_chip_dir.root</text>
<text x="40" y="516" fill="#b91c1c">what: the family root (the trust anchor) is computed by no named function. I-1 gives `is_openable_chip_dir(target, root)` but no producer of `root`</text>
<text x="40" y="530" fill="#b91c1c">decision: adds one pure node to I-1, for example `chip_family_root(project_dir, base_dir) -&gt; Path`, or a line in D9 that fixes the root to `base_dir / WORKAREA_DIRNAME`</text>
