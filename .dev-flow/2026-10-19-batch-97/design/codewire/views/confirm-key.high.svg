<text x="40" y="462" fill="#b91c1c">H-X1 · FlowExecutionPanel.apply_confirmed_run</text>
<text x="40" y="476" fill="#b91c1c">what: after a confirmation the re-run can wait again at a second external step, but `apply_confirmed_run` always sets `paused_block = None` and hides Confirm. The lane shows no wait and offers no Confirm</text>
<text x="40" y="490" fill="#b91c1c">decision: changes I-7 / Inc-6 scope: `apply_confirmed_run` derives `paused_block` from the waiting result, as `render_run` does (`flow_screens.py:2429-2445`), and re-arms the attention</text>
<rect x="30" y="518" width="2300" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="534" fill="#b91c1c">H-X2 · [Data: FlowExecutionPanel attention]</text>
<text x="40" y="548" fill="#b91c1c">what: the attention lane, the paint time of its wait and the set of confirmed entries are state that `confirm_attention` reads. No decision names this state, its writers or the post-paint hook that sets the dwell base</text>
<text x="40" y="562" fill="#b91c1c">decision: adds to I-7: the attention state, its two writers and the `call_after_refresh` hook that stamps the dwell base</text>
<rect x="30" y="590" width="2300" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="606" fill="#b91c1c">H-X3 · FlowExecutionPanel.apply_confirmed_run</text>
<text x="40" y="620" fill="#b91c1c">what: the re-run lines of the run log use the absolute monotonic time and the status glyph without its word: &quot;29535:44.249 □ ext2 · done&quot;</text>
<text x="40" y="634" fill="#b91c1c">decision: no D change. Record it in the Inc-6 scope beside H-X1 (same function)</text>
