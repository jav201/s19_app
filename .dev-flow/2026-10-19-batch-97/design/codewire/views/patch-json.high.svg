<rect x="30" y="498" width="2640" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="514" fill="#b91c1c">H-P1 · S19TuiApp.on_patch_editor_panel_action_requested ──▶ PatchEditorPanel.refresh_entries.rows</text>
<text x="40" y="528" fill="#b91c1c">what: every Patch Editor action ends at `app.py:3265` with a `refresh_entries` call, Save included. With D1 that call also carries `document=`</text>
<text x="40" y="542" fill="#b91c1c">decision: no change to D4. TC-B97-06 names the typing arm as the RED arm of that mutation, or D1 passes `document=` only when the document changed</text>
<rect x="30" y="570" width="2640" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="586" fill="#b91c1c">H-P2 · S19TuiApp._patch_document_view ──▶ serialize_change_document.document</text>
<text x="40" y="600" fill="#b91c1c">what: the serialiser runs once for each `refresh_entries` call, not once for each document write. That is 11 action kinds, undo, redo, entry JSON edit, every image load, and two times for one Load by button</text>
<text x="40" y="614" fill="#b91c1c">decision: changes D1 or §6.2. Build the view only when a document revision changed (the writers mutate in place, so object identity is not a key). Or keep D1 and measure the 100,000-entry cost per action</text>
<rect x="30" y="642" width="2640" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="658" fill="#b91c1c">H-P3 · [Data: PatchEditorPanel._document_view] ──▶ PatchEditorPanel._refresh_dirty_indicator</text>
<text x="40" y="672" fill="#b91c1c">what: D4 composes the stamp in `_refresh_dirty_indicator` from `n` and `hhmmss`, but no design element keeps them. The graph needs a retained view with its refresh time, and its initial value</text>
<text x="40" y="686" fill="#b91c1c">decision: D2/D4 add the retained field and say which time the stamp shows. LLR-148.9 names the fresh-start state of the JSON view</text>
<rect x="30" y="714" width="2640" height="52" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
<text x="40" y="730" fill="#b91c1c">H-P4 · serialize_change_document.wire ──▶ S19TuiApp._patch_document_view.view.json_text</text>
<text x="40" y="744" fill="#b91c1c">what: the serialiser returns `bytes`. D2 types `json_text` as `str`</text>
<text x="40" y="758" fill="#b91c1c">decision: none. Record the decode in D2</text>
