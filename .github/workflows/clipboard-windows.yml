name: clipboard-windows

# The OS clipboard tests of batch-103 Inc 1a (R-PASTE.20): Windows only, on a
# GitHub-hosted runner, whose clipboard belongs to no person (R-PASTE.21).
# Separate from tui-ci.yml (D-6 B), which stays unchanged.
on:
  workflow_dispatch:
  push:
    paths:
      - "s19_app/tui/os_clipboard_input.py"
      - "s19_app/tui/capped_text_area.py"
      - "s19_app/**/*.py"
      - "tests/__init__.py"
      - "tests/conftest.py"
      - "tests/support/b103_clipboard.py"
      - "tests/support/**"
      - "tests/test_b103_clipboard_windows.py"
      - "tests/test_b103_clipboard_matrix.py"
      - "tests/test_b103_copy_views.py"
      - "tests/test_b103_clipboard_tail.py"
      - "tests/test_b103_copy_quit_dialog.py"
      - "tests/test_b103_copy_paste_matrix.py"
      - "tests/test_b103_winci_gate.py"
      - "examples/case_00_public/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/clipboard-windows.yml"
  pull_request:
    paths:
      - "s19_app/tui/os_clipboard_input.py"
      - "s19_app/tui/capped_text_area.py"
      - "s19_app/**/*.py"
      - "tests/__init__.py"
      - "tests/conftest.py"
      - "tests/support/b103_clipboard.py"
      - "tests/support/**"
      - "tests/test_b103_clipboard_windows.py"
      - "tests/test_b103_clipboard_matrix.py"
      - "tests/test_b103_copy_views.py"
      - "tests/test_b103_clipboard_tail.py"
      - "tests/test_b103_copy_quit_dialog.py"
      - "tests/test_b103_copy_paste_matrix.py"
      - "tests/test_b103_winci_gate.py"
      - "examples/case_00_public/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/clipboard-windows.yml"

permissions:
  contents: read

jobs:
  clipboard-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest "textual==8.2.8"
          python -m pip install -e . "textual==8.2.8"

      - name: Print and verify the toolkit version the design rests on (E3A-10 a)
        run: python -c "import sys, textual; print(sys.version, textual.__version__); assert textual.__version__ == '8.2.8', textual.__version__"

      - name: Validate the independent WinCI manifest
        timeout-minutes: 5
        run: python tests/support/b103_winci_gate.py --validate-manifest

      - name: Run the OS clipboard tests and audit every JUnit outcome
        id: outcomes
        continue-on-error: true
        timeout-minutes: 45
        run: |
          $junit = Join-Path $env:RUNNER_TEMP "b103-winci-junit.xml"
          $transcript = Join-Path $env:RUNNER_TEMP "b103-winci-pytest.txt"
          $gateTranscript = Join-Path $env:RUNNER_TEMP "b103-winci-gate.txt"
          & python -m pytest -v -rs --durations=20 --junitxml="$junit" tests/test_b103_clipboard_windows.py tests/test_b103_clipboard_matrix.py tests/test_b103_copy_views.py tests/test_b103_clipboard_tail.py tests/test_b103_copy_quit_dialog.py tests/test_b103_copy_paste_matrix.py 2>&1 | Tee-Object -FilePath "$transcript"
          $pytestExit = $LASTEXITCODE
          & python tests/support/b103_winci_gate.py --junit-xml "$junit" --pytest-exit $pytestExit 2>&1 | Tee-Object -FilePath "$gateTranscript"
          $gateExit = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_ENV -Value "WINCI_PYTEST_EXIT=$pytestExit"
          Add-Content -Path $env:GITHUB_ENV -Value "WINCI_GATE_EXIT=$gateExit"
          Write-Host "PYTEST_EXIT=$pytestExit GATE_EXIT=$gateExit"
          exit $gateExit

      - name: Scan transcript and JUnit before any artifact upload
        id: artifact_safety
        if: always()
        run: |
          $junit = Join-Path $env:RUNNER_TEMP "b103-winci-junit.xml"
          $transcript = Join-Path $env:RUNNER_TEMP "b103-winci-pytest.txt"
          $gateTranscript = Join-Path $env:RUNNER_TEMP "b103-winci-gate.txt"
          $safetyTranscript = Join-Path $env:RUNNER_TEMP "b103-winci-artifact_safety.txt"
          & python tests/support/b103_artifact_safety.py --transcript "$transcript" --junit-xml "$junit" --gate-transcript "$gateTranscript" 2>&1 | Tee-Object -FilePath "$safetyTranscript"
          $safetyExit = $LASTEXITCODE
          Write-Host "ARTIFACT_SAFETY_EXIT=$safetyExit"
          exit $safetyExit

      - name: Preserve WinCI pytest, JUnit, gate and safety output
        if: always() && steps.artifact_safety.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: b103-winci-outcomes
          path: |
            ${{ runner.temp }}/b103-winci-pytest.txt
            ${{ runner.temp }}/b103-winci-junit.xml
            ${{ runner.temp }}/b103-winci-gate.txt
            ${{ runner.temp }}/b103-winci-artifact_safety.txt
          if-no-files-found: error

      - name: Enforce the preserved pytest and WinCI gate exit
        if: always()
        run: |
          if ([string]::IsNullOrEmpty($env:WINCI_GATE_EXIT)) {
            Write-Host "WINCI_GATE_EXIT is missing; failing closed"
            exit 2
          }
          Write-Host "PYTEST_EXIT=$env:WINCI_PYTEST_EXIT GATE_EXIT=$env:WINCI_GATE_EXIT"
          exit [int]$env:WINCI_GATE_EXIT
