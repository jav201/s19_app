name: tui-ci

# Two-tier gate (batch-07 CI-1, operator decision 2026-06-10), two lanes each
# (batch-101 Inc 2, R-TST.10, R-TST.11):
#  - PRs run the lean suite (-m "not slow"): lane 1 in parallel over the
#    runner's CPUs without the wall-clock timing arms, then lane 2 the timing
#    arms serially (-m "serial_timing and not slow").
#  - Pushes to main / main-tui run the FULL suite (incl. slow perf smoke
#    tests) over two jobs. In tui-ci, lane 1 parallel (-m "not serial_timing")
#    and lane 2 serial (-m "serial_timing and not slow"); lane 2 also runs
#    after a red or timed-out lane 1. Beside it, the push-only tui-ci-heavy job
#    (R-TST.19, R-TST.26) runs the slow timing arms serially
#    (-m "slow and serial_timing"), so the two jobs together run every timing
#    arm (-m serial_timing).
on:
  pull_request:
    branches:
      - main
      - main-tui
  push:
    branches:
      - main
      - main-tui

# Least-privilege (batch-25): every job needs only to read the checked-out
# source. No job writes back to the repo (baseline regeneration is a manual,
# artifact-upload-only workflow_dispatch in snapshot-regen.yml).
permissions:
  contents: read

jobs:
  tui-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Make the local main ref available to the history arms
        # The history arms diff against a local `main`; a pull-request checkout
        # has only origin/main, so create the local ref when it is missing.
        run: |
          git rev-parse --verify --quiet refs/heads/main || git branch main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install "pytest-xdist==3.8.0"
          python -m pip install -e ".[evidence]"
          python -c "from PIL import Image, ImageDraw, ImageFont, features; import PIL; assert features.check('freetype2'), 'freetype2 unavailable'; print(PIL.__version__)"

      - name: Run lean test suite (pull requests)
        if: github.event_name == 'pull_request'
        timeout-minutes: 120
        run: pytest -v -rs -n auto -m "not slow and not serial_timing"

      - name: Run timing arms (pull requests)
        if: github.event_name == 'pull_request' && !cancelled() && steps.install.outcome == 'success'
        timeout-minutes: 30
        run: pytest -q -rs -m "serial_timing and not slow"

      - name: Run full test suite (pushes)
        if: github.event_name == 'push'
        timeout-minutes: 220
        run: pytest -v -rs -n auto -m "not serial_timing"

      - name: Run timing arms (pushes)
        if: github.event_name == 'push' && !cancelled() && steps.install.outcome == 'success'
        timeout-minutes: 75
        run: pytest -q -rs -m "serial_timing and not slow"

  # The heavy case_06 timing arms (slow and serial_timing) in their own
  # push-only job (batch 2026-11-18-a2l-load-performance E4R, operator Q2 = A).
  # No needs, so it runs beside tui-ci, a red tui-ci does not skip it, and its
  # wall time does not count against the tui-ci limits.
  tui-ci-heavy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # 123 = ceil(1.5 x 41 min x 2): 41 min is the laptop wall of
    # -m "slow and serial_timing" run serially, 2 the CI factor (R-TST.26).
    timeout-minutes: 123
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Make the local main ref available to the history arms
        # The history arms diff against a local `main`; a pull-request checkout
        # has only origin/main, so create the local ref when it is missing.
        run: |
          git rev-parse --verify --quiet refs/heads/main || git branch main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install "pytest-xdist==3.8.0"
          python -m pip install -e ".[evidence]"
          python -c "from PIL import Image, ImageDraw, ImageFont, features; import PIL; assert features.check('freetype2'), 'freetype2 unavailable'; print(PIL.__version__)"

      - name: Run heavy timing arms (pushes)
        run: pytest -q -rs -m "slow and serial_timing"

  # Non-blocking layout-drift oracle (batch-25). Runs the pytest-textual-snapshot
  # suite that the main tui-ci job cannot (it never installs the [dev] extra, so
  # the 28 snapshot cells were silently SKIPPED on every PR/push). `continue-on-
  # error: true` keeps this job advisory: drift surfaces in the run log but does
  # NOT fail the workflow or block merges. Baselines are regenerated only in this
  # same canonical env via snapshot-regen.yml (never locally — see the
  # snapshot-regen-env convention).
  snapshot:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (with dev extra for pytest-textual-snapshot)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Run TUI layout-snapshot suite (28 baseline cells + 2 xfail-until-baseline entropy cells)
        run: pytest tests/test_tui_snapshot.py -m snapshot -q
