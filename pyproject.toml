# S19_APP/pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "s19tool"
version = "0.1.0"
description = "A CLI tool for visualizing and patching Motorola S19 files"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
readme = "README.md"
# Floor = the version CI actually verifies (batch-89). The packaged tree's
# mechanical floor is 3.10 -- 39 `@dataclass(slots=True)` sites across 16
# files (slots= landed in 3.10) plus the PEP 604 union at `s19_app/cli.py:220`,
# which is evaluated at def time because cli.py has no `from __future__ import
# annotations`. No CI job runs 3.10, so the declared floor stays at 3.11, the
# only version the suite is green on. Lowering to 3.10 is a non-breaking
# loosening once a 3.10 CI cell exists.
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "rich>=13.0",
    # Lower-bound floor (C-8 / OQ-13). Set to the currently-installed version
    # so nothing breaks; no upper ceiling. Required-minimum bound for the
    # dev-only pytest-textual-snapshot extra below.
    "textual>=8.0.2",
    # Direct import since batch-60: `screens._hardened_markdown_parser` builds the
    # report viewer's parser explicitly (linkify + raw HTML off). It also arrives
    # transitively via rich/textual, but a module-level import in the TUI must not
    # rely on a transitive edge — a dropped or renamed dependency would fail the
    # whole app at import time, not at report-view time (final-gate F3).
    "markdown-it-py>=3",
]

[project.optional-dependencies]
# Dev-only snapshot-testing extra (C-2 scoped exception, OQ-5 approved).
# pytest-textual-snapshot is NEVER added to [project] dependencies — it does
# not affect the s19tui runtime footprint. Install with: pip install -e .[dev]
# Version: pinned for CI-reproducible snapshot baselines (S-5 resolved).
dev = [
    "pytest-textual-snapshot==1.1.0",
    # Pin the renderer exactly (batch-25): SVG snapshot baselines are
    # textual-version sensitive. The runtime floor above (textual>=8.0.2) has
    # no ceiling, so CI drifted to 8.2.8 and silently invalidated every
    # 2026-05-22 baseline. Pinning here (dev / snapshot env only; runtime stays
    # >=8.0.2) locks the baselines to a known-good render. To adopt a newer
    # textual: bump this pin, then regenerate via snapshot-regen.yml.
    "textual==8.2.8",
]

# Evidence-only imaging extra (batch-88, operator ruling 2026-08-26).
# tests/test_examples_pilot_gifs.py imports PIL to render the example GIFs.
# Like the dev extra above, pillow is NEVER added to [project] dependencies
# — it does not affect the s19tui runtime footprint. It is kept OUT of dev
# on purpose: dev pins textual==8.2.8 for the snapshot baselines, and the
# tui-ci job that needs the imaging library collects the FULL suite and must
# stay on the >=8.0.2 runtime floor. Install with: pip install -e .[evidence]
evidence = [
    # Floored, not bare and not pinned (batch-88 F1). This is a MAJOR-VERSION and
    # reproducibility floor: it excludes 9.x and refuses the specifier-less style
    # that batch-88 registers as a defect (R-88-6), so CI cannot silently resolve
    # across a major boundary.
    #
    # It does NOT assert a patch level of the C libraries manylinux wheels vendor
    # (libjpeg-turbo, zlib, libtiff, libwebp, freetype). ">=10" admits 10.0.0, and
    # every vendored-library bump lands ABOVE it, so the guarantee is empty inside
    # the admitted range. Measured 2026-08-27: with pillow 10.1.0 already present,
    # `pip install -e ".[evidence]"` reports "Requirement already satisfied" and
    # leaves it — pip's only-if-needed strategy does not pull a satisfying old
    # version forward. >=10.3 is the smallest value that would deliver the
    # vendored-patch reading; raising it needs an operator ruling (batch-88 F2).
    "pillow>=10",
]

[project.scripts]
s19tui = "s19_app.tui:main"

[tool.setuptools.packages.find]
include = ["s19_app*"]

[tool.pytest.ini_options]
# Make the repo root importable so `from tests.conftest import ...` works
# under a bare `pytest` invocation (CI) exactly as it does under
# `python -m pytest` (which prepends the cwd to sys.path itself).
pythonpath = ["."]
markers = [
    "slow: marks tests as slow perf smoke tests (deselect with -m 'not slow')",
    "snapshot: marks pytest-textual-snapshot layout-drift tests (deselect with -m 'not snapshot')",
]
